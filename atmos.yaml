#Stack configuration pointing to 'environments/' directory
#Paths are relative to this file (repo root)
base_path: "."

#Stacks live in environments/
stacks:
  base_path: "environments"
  included_paths:
    - "**/*"
  #_defaults.yaml is just a shared stack, imported into dev/prod, and is not a runnable stack
  excluded_paths:
    - "**/_defaults.yaml"
  name_pattern: "{stage}"

#Component configuration pointing to your 'components/' directory
components:
  terraform:
    base_path: "components/terraform"
    apply_auto_approve: false
    deploy_run_init: true
    init_run_reconfigure: true
    #Atmos writes backend.tf.json into the component directory from the stack's 'backend' section
    auto_generate_backend_file: true

#CLI Logs and Output Preferences
logs:
  file: "/dev/stderr"
  level: Info
