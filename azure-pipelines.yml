trigger:
  branches:
    include:
      - main
      - dev

pr:
  branches:
    include:
      - main
      - dev

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Map ADO branches to Atmos stages
  ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
    ATMOS_STAGE: 'prod'
  ${{ else }}:
    ATMOS_STAGE: 'dev'
  
  ATMOS_VERSION: '1.88.0' # Adjust to your preferred Atmos release

steps:
  # 1. Install Terraform CLI
  - task: HashiCorpTerraformInstaller@1
    displayName: 'Install Terraform'
    inputs:
      terraformVersion: 'latest'

  # 2. Install Atmos CLI
  - script: |
      echo "Installing Atmos v$(ATMOS_VERSION)..."
      curl -sL https://github.com/cloudposse/atmos/releases/download/v$(ATMOS_VERSION)/atmos_$(ATMOS_VERSION)_linux_amd64 -o /usr/local/bin/atmos
      chmod +x /usr/local/bin/atmos
      atmos version
    displayName: 'Install Atmos CLI'

  # 3. AWS Credentials Setup (Option A: AWS OIDC / Service Connection or Env Vars)
  # Ensure AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, and TF_VAR_password are set in ADO Pipeline Variables

  # 4. Atmos Plan (Runs on both PRs and Branch Merges)
  - script: |
      echo "Running Atmos Plan for component 'core' in stage: $(ATMOS_STAGE)"
      atmos terraform plan core -s $(ATMOS_STAGE)
    displayName: 'Atmos Terraform Plan'
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      AWS_DEFAULT_REGION: 'us-east-1'
      TF_VAR_password: $(DB_PASSWORD) # Pass DB password securely from Pipeline Secret Variable

  # 5. Atmos Apply (Runs ONLY on merge to main or dev branch, skip on PRs)
  - script: |
      echo "Running Atmos Apply for component 'core' in stage: $(ATMOS_STAGE)"
      atmos terraform apply core -s $(ATMOS_STAGE) -auto-approve
    displayName: 'Atmos Terraform Apply'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      AWS_DEFAULT_REGION: 'us-east-1'
      TF_VAR_password: $(DB_PASSWORD)
