trigger:
  branches:
    include:
      - main
      - dev

pr:
  branches:
    include:
      - main
      - dev

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: ATMOS_VERSION
    value: '1.88.0'
  - name: TERRAFORM_VERSION
    value: '1.10.0'
  # Map ADO branches to Atmos stages cleanly
  - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
      - name: ATMOS_STAGE
        value: 'prod'
  - ${{ if ne(variables['Build.SourceBranchName'], 'main') }}:
      - name: ATMOS_STAGE
        value: 'dev'

steps:
  # 1. Install Terraform CLI via script (bypasses extension task dependency issues)
  - script: |
      echo "Installing Terraform v$(TERRAFORM_VERSION)..."
      wget -q https://releases.hashicorp.com/terraform/$(TERRAFORM_VERSION)/terraform_$(TERRAFORM_VERSION)_linux_amd64.zip
      unzip -q terraform_$(TERRAFORM_VERSION)_linux_amd64.zip
      sudo mv terraform /usr/local/bin/
      terraform version
    displayName: 'Install Terraform CLI'

  # 2. Install Atmos CLI
  - script: |
      echo "Installing Atmos v$(ATMOS_VERSION)..."
      curl -sL https://github.com/cloudposse/atmos/releases/download/v$(ATMOS_VERSION)/atmos_$(ATMOS_VERSION)_linux_amd64 -o /usr/local/bin/atmos
      chmod +x /usr/local/bin/atmos
      atmos version
    displayName: 'Install Atmos CLI'

  # 3. Atmos Plan (Runs on both PRs and Branch Merges)
  - script: |
      echo "Running Atmos Plan for component 'core' in stage: $(ATMOS_STAGE)"
      atmos terraform plan core -s $(ATMOS_STAGE)
    displayName: 'Atmos Terraform Plan'
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      AWS_DEFAULT_REGION: 'us-east-1'
      TF_VAR_password: $(DB_PASSWORD)

  # 4. Atmos Apply (Runs ONLY on merge to main or dev branch, skip on PRs)
  - script: |
      echo "Running Atmos Apply for component 'core' in stage: $(ATMOS_STAGE)"
      atmos terraform apply core -s $(ATMOS_STAGE) -auto-approve
    displayName: 'Atmos Terraform Apply'
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    env:
      AWS_ACCESS_KEY_ID: $(AWS_ACCESS_KEY_ID)
      AWS_SECRET_ACCESS_KEY: $(AWS_SECRET_ACCESS_KEY)
      AWS_DEFAULT_REGION: 'us-east-1'
      TF_VAR_password: $(DB_PASSWORD)